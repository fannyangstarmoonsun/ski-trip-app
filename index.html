<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪与温泉 · 日本冬游</title>
<meta name="theme-color" content="#1b2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雪与温泉">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: app shell — sticky header, one scrolling view, fixed bottom tab bar. Snow-night navy with a torii-red accent; each region gets its own colour. */
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --fg: #1b2638;
  --muted: #5f6b82;
  --line: #dbe2ec;
  --night: #1b2a44;
  --night-fg: #f2f5fa;
  --accent: #d6452a;
  --accent-soft: #fbe7e2;
  --ok: #2f8a5b;
  --r-fuji: #d6452a;
  --r-hakuba: #2f6fd0;
  --r-nozawa: #178a83;
  --r-kanazawa: #b8871b;
  --r-tokyo: #7a4fc2;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1320; --surface: #161e2e; --surface-2: #1c2538; --fg: #e8edf6; --muted: #98a4bb; --line: #27324a;
    --night: #0a1020; --night-fg: #eef2fa; --accent: #ff6c4f; --accent-soft: #3a1e1a; --ok: #4fc187;
    --r-fuji: #ff6c4f; --r-hakuba: #6ea3ff; --r-nozawa: #3cc2b8; --r-kanazawa: #e3b04a; --r-tokyo: #b08cf0;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--r-hakuba); outline-offset: 2px; }
a { color: inherit; }
.ja { font-family: var(--font-ja); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--night); color: var(--night-fg);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px;
}
.top h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 small { display: block; font-size: 12px; font-weight: 500; opacity: .7; letter-spacing: 0; }
.pill-toggle { display: flex; background: rgba(255,255,255,.12); border-radius: 99px; padding: 3px; }
.pill-toggle button { border: 0; background: transparent; color: var(--night-fg); font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 99px; opacity: .7; }
.pill-toggle button.on { background: var(--night-fg); color: var(--night); opacity: 1; }
.icon-btn { border: 0; background: rgba(255,255,255,.12); color: var(--night-fg); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- Main ---------- */
main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 96px) max(16px, env(safe-area-inset-left, 0px)); max-width: 680px; margin: 0 auto; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.section-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 6px 2px -4px; text-transform: uppercase; }

/* ---------- Day strip ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)) 6px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day-chip { scroll-snap-align: center; flex: 0 0 auto; width: 64px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 4px 7px; text-align: center; display: grid; gap: 2px; position: relative; }
.day-chip b { font-size: 12px; color: var(--muted); font-weight: 600; }
.day-chip span { font-size: 18px; font-weight: 800; line-height: 1.1; }
.day-chip i { font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-chip::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--rc); }
.day-chip.on { background: var(--rc); border-color: var(--rc); color: #fff; }
.day-chip.on b, .day-chip.on i { color: rgba(255,255,255,.85); }
.day-chip.today::before { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.day-chip.on.today::before { background: #fff; }

/* ---------- Day hero ---------- */
.hero { padding: 16px 16px 14px; display: grid; gap: 8px; border-top: 5px solid var(--rc); }
.hero-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.region { background: var(--rc); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 99px; }
.hero h2 { margin: 0; font-size: 22px; line-height: 1.3; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); }
.swipe-hint { font-size: 12px; color: var(--muted); text-align: center; }

.map-wrap { overflow: hidden; position: relative; }
.map-wrap iframe { display: block; width: 100%; height: 220px; border: 0; background: var(--surface-2); }
.map-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 10px; font-size: 13px; color: var(--muted); }
.map-bar a { color: var(--r-hakuba); font-weight: 600; text-decoration: none; white-space: nowrap; }
.offline-map { height: 120px; display: grid; place-items: center; color: var(--muted); font-size: 13px; background: var(--surface-2); text-align: center; padding: 16px; }

/* ---------- Timeline ---------- */
.timeline { padding: 6px 0; }
.ti { display: grid; grid-template-columns: 58px 22px minmax(0, 1fr); gap: 0 8px; padding: 0 14px 0 10px; position: relative; }
.ti-time { font-size: 13px; font-weight: 700; padding-top: 14px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.ti-rail { position: relative; display: flex; justify-content: center; }
.ti-rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.ti:first-child .ti-rail::before { top: 18px; }
.ti:last-child .ti-rail::before { bottom: auto; height: 18px; }
.dot { position: relative; margin-top: 16px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--rc); }
.ti.move .dot { width: 22px; height: 22px; margin-top: 12px; border: 0; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.ti.move .dot svg { width: 14px; height: 14px; }
.ti-body { padding: 10px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.ti:last-child .ti-body { border-bottom: 0; }
.ti-name { font-weight: 700; font-size: 16px; line-height: 1.35; }
.ti.move .ti-name { font-weight: 600; font-size: 14px; color: var(--muted); }
.ti-ja { font-size: 13px; color: var(--muted); }
.ti-note { font-size: 14px; margin-top: 4px; }
.ti-tip { font-size: 13px; margin-top: 6px; padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); }
.ti-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.nav-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: var(--r-hakuba); color: #fff; }
.nav-btn svg { width: 14px; height: 14px; }
.ghost-btn { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.ghost-btn.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.dur { font-size: 12px; color: var(--muted); }

/* ---------- Stay + costs ---------- */
.stay { padding: 14px 16px; display: grid; gap: 6px; }
.stay-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.stay h3 { margin: 0; font-size: 17px; }
.status { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.status.todo { background: var(--accent-soft); color: var(--accent); }
.status.ok { background: var(--ok); color: #fff; }
.stay p { margin: 0; font-size: 14px; color: var(--muted); }
.link { color: var(--r-hakuba); font-weight: 600; font-size: 14px; text-decoration: none; }

.costs { padding: 14px 16px; }
.costs-head { display: flex; justify-content: space-between; align-items: baseline; }
.costs-head h3 { margin: 0; font-size: 15px; }
.costs-head .big { font-size: 22px; font-weight: 800; }
.cost-row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px dashed var(--line); gap: 12px; }
.cost-row:last-child { border-bottom: 0; }
.cost-row span:last-child { font-variant-numeric: tabular-nums; }
.fineprint { font-size: 12px; color: var(--muted); margin-top: 6px; }

.pager { display: flex; justify-content: space-between; gap: 10px; }
.pager button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 600; }
.pager button:disabled { opacity: .35; }

/* ---------- Flights ---------- */
.flight { padding: 14px 16px; display: grid; gap: 8px; }
.flight-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.flight-code { font-weight: 800; font-size: 17px; }
.flight-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.flight-route .apt { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
.flight-route .apt small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.flight-route .to { text-align: right; }
.flight-route .line { height: 2px; width: 48px; background: var(--line); position: relative; }
.flight-route .line::after { content: "✈"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); font-size: 14px; color: var(--muted); background: var(--surface); padding: 0 3px; }
.flight-times { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tbd { color: var(--accent); font-weight: 600; }

/* ---------- Forms ---------- */
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.primary { border: 0; background: var(--night); color: var(--night-fg); border-radius: 12px; padding: 12px 16px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .primary { background: var(--accent); color: #fff; } }
.inline-form { display: grid; gap: 10px; padding-top: 8px; }

/* ---------- Phrases ---------- */
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)); }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
.cats button.on { background: var(--night); color: var(--night-fg); border-color: var(--night); }
@media (prefers-color-scheme: dark) { .cats button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); } }
.phrase { padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); }
.phrase .jp { font-family: var(--font-ja); font-size: 18px; font-weight: 700; line-height: 1.4; }
.phrase .ro { font-size: 13px; color: var(--muted); font-style: italic; }
.phrase .mean { font-size: 14px; }
.phrase .side { grid-row: 1 / span 3; grid-column: 2; display: flex; gap: 6px; }
.round { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--fg); }
.round svg { width: 17px; height: 17px; }
.sos { padding: 14px 16px; display: grid; gap: 6px; border-left: 5px solid var(--accent); }
.sos h3 { margin: 0; font-size: 15px; }
.sos-nums { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.sos-nums b { font-size: 20px; font-variant-numeric: tabular-nums; }

.show-card { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(24px, env(safe-area-inset-left, 0px)); text-align: center; }
.show-card .jp { font-family: var(--font-ja); font-size: clamp(32px, 9vw, 56px); font-weight: 800; line-height: 1.35; }
.show-card .mean { font-size: 18px; color: var(--muted); margin-top: 16px; }
.show-card .close { margin-top: 32px; }

/* ---------- Expenses ---------- */
.sum { padding: 16px; display: grid; gap: 12px; }
.sum-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.sum-top .big { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum-top small { color: var(--muted); font-size: 13px; display: block; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--r-nozawa); border-radius: 99px; }
.bar.over i { background: var(--accent); }
.cat-rows { display: grid; gap: 8px; }
.cat-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.cat-row .bar { height: 8px; }
.cat-row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.chips button.on { background: var(--r-nozawa); border-color: var(--r-nozawa); color: #fff; }
.add { padding: 16px; display: grid; gap: 12px; }
.add h3, .sum h3 { margin: 0; font-size: 16px; }
.amount-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
.amount-row input { font-size: 20px; font-weight: 700; }
.exp-day { padding: 4px 0; }
.exp-day h4 { margin: 0; padding: 10px 16px 4px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.exp { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); }
.exp .what { font-weight: 600; font-size: 14px; }
.exp .what small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.exp .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.exp .amt small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.del { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; }
.del.confirm { background: var(--accent); color: #fff; width: auto; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); background: var(--night); color: var(--night-fg); padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 40; }

/* ---------- Settings sheet ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(5,10,20,.45); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-width: 680px; margin: 0 auto; }
.sheet h2 { margin: 0; font-size: 19px; }
.sheet h3 { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.sheet .hint { font-size: 12.5px; color: var(--muted); margin: -6px 0 0; }

/* ---------- Tab bar ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.tabs svg { width: 23px; height: 23px; }
.tabs button.on { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .view-anim { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<header class="top">
  <h1 id="appTitle">雪与温泉<small id="appDates"></small></h1>
  <div class="pill-toggle" role="group" aria-label="Currency">
    <button id="curJPY" type="button">¥</button><button id="curRM" type="button">RM</button>
  </div>
  <div class="pill-toggle" role="group" aria-label="Language">
    <button id="langZh" type="button">中</button><button id="langEn" type="button">EN</button>
  </div>
  <button class="icon-btn" id="openSettings" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs"></nav>

<div id="sheetRoot"></div>
<div id="overlayRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
